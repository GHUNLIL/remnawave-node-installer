name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check
        run: bash -n install.sh tests/test-install.sh
      - name: ShellCheck
        run: shellcheck install.sh tests/test-install.sh
      - name: Tests
        run: bash tests/test-install.sh
